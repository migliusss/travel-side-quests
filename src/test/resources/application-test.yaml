spring:
  security:
    user:
      name: admin
      password: test-only-password
      roles: ADMIN

minio:
  # No MinIO container in the test run: ImageStorage is replaced with an in-memory fake,
  # and this flag keeps the bucket bootstrap from reaching for a server that isn't there.
  bootstrap: false
  endpoint: http://localhost:9000
  access-key: test
  secret-key: test
  bucket: test-bucket

app:
  cors:
    allowed-origins: http://localhost:5173
  uploads:
    max-per-hour: 1000
