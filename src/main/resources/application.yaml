spring:
  application:
    name: travel-side-quests

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  flyway:
    enabled: true

  data:
    web:
      pageable:
        max-page-size: 100

  jpa:
    # Flyway owns the schema; this makes a drift between it and the entities fail at startup
    # rather than at the first query that touches the changed column.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50

  jackson:
    deserialization:
      # A typo in a submission should be a 400, not silently dropped data.
      fail-on-unknown-properties: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  security:
    user:
      name: ${ADMIN_USER:admin}
      password: ${ADMIN_PASSWORD}
      roles: ADMIN

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  uploads:
    # Anyone can submit, so cap how often one address may upload.
    max-per-hour: ${UPLOAD_MAX_PER_HOUR:20}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:side-quest-images}
